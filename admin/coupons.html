<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — WigsbyAmah Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="btn btn-outline btn-icon" id="sidebarToggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <h1 id="pageTitle">Coupons</h1>
      </div>
      <div class="admin-topbar-actions">
        <button class="btn btn-primary btn-sm" id="newCouponBtn"><i class="fa-solid fa-plus"></i> New Coupon</button>
      </div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel-head"><h3>All Coupons</h3></div>
        <p style="font-size:13px;color:var(--gray-500);margin:-10px 0 18px;">Customers can enter these codes at checkout to get a discount. Codes are matched case-insensitively.</p>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Usage</th><th>Expires</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="couponsBody">
              <tr class="empty-row"><td colspan="7">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Coupon Modal -->
<div class="modal-overlay" id="couponModal">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-head">
      <h3 id="modalTitle">New Coupon</h3>
      <button class="modal-close" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="couponForm">
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="form-group">
          <label>Coupon Code *</label>
          <input type="text" name="code" required placeholder="e.g. WELCOME10" style="text-transform:uppercase;">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Discount Type *</label>
            <select name="discount_type" required>
              <option value="percent">Percent off (%)</option>
              <option value="fixed">Fixed amount off</option>
            </select>
          </div>
          <div class="form-group">
            <label>Discount Value *</label>
            <input type="number" name="discount_value" min="0" step="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Minimum Order</label>
            <input type="number" name="min_order" min="0" step="0.01" value="0">
            <p class="form-hint">0 = no minimum</p>
          </div>
          <div class="form-group">
            <label>Max Uses</label>
            <input type="number" name="max_uses" min="0" value="0">
            <p class="form-hint">0 = unlimited</p>
          </div>
        </div>
        <div class="form-group">
          <label>Expiry Date</label>
          <input type="date" name="expires_at">
          <p class="form-hint">Leave blank for no expiry.</p>
        </div>
        <div class="form-group">
          <label class="checkbox-row"><input type="checkbox" name="active" checked> Active (can be used right now)</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveCouponBtn"><i class="fa-solid fa-check"></i> Save Coupon</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/coupons-admin.js"></script>
</body>
</html>
