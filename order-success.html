<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — WigsbyAmah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="site-content-loading">

<div id="header-slot"></div>

<main class="container">
  <div class="success-box">
    <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    <h1 style="font-size:26px;font-weight:800;margin:0 0 10px;">Order Placed Successfully!</h1>
    <p style="color:var(--gray-500);" id="successMsg">Thank you for your order. We've sent a confirmation to your email.</p>
    <div class="order-number-box" id="orderNumberBox">—</div>
    <p style="font-size:13.5px;color:var(--gray-500);">Keep this order number to track your order status anytime.</p>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap;">
      <a href="track-order.html" class="btn btn-primary">Track My Order</a>
      <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
    </div>
  </div>
</main>

<div id="footer-slot"></div>
<div id="bottom-nav-slot"></div>

<script src="js/api.js"></script>
<script src="js/site-content.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initLayout('');
  const orderNumber = sessionStorage.getItem('lastOrderNumber');
  if (orderNumber) {
    document.getElementById('orderNumberBox').textContent = orderNumber;
  } else {
    document.getElementById('orderNumberBox').textContent = 'No recent order found';
    document.getElementById('successMsg').textContent = 'It looks like you navigated here directly. Check your email for order confirmation, or track your order below.';
  }
});
</script>
</body>
</html>
