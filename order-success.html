<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — WigsbyAmah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="container">
  <div class="success-box">
    <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    <h1 style="font-size:26px;font-weight:800;margin:0 0 10px;">Order Placed Successfully!</h1>
    <p style="color:var(--gray-500);" id="successMsg">Thank you for your order. We've sent a confirmation to your email.</p>
    <div class="order-number-box" id="orderNumberBox">—</div>
    <p style="font-size:13.5px;color:var(--gray-500);">Keep this order number to track your order status anytime.</p>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap;">
      <a href="track-order.html" class="btn btn-primary">Track My Order</a>
      <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
    </div>
  </div>
</main>

<div id="footer-slot"></div>
<div id="bottom-nav-slot"></div>

<script src="js/api.js"></script>
<script src="js/site-content.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/layout.js"></script>
<script>
async function completePendingPaystackOrder(reference) {
  const raw = sessionStorage.getItem('pendingPaystackOrderPayload');
  if (!raw) return false;

  const orderPayload = JSON.parse(raw);
  const verifyRes = await fetch(`${__API_BASE}api/paystack.php?action=verify-transaction&reference=${encodeURIComponent(reference || orderPayload.paystack_reference || orderPayload.order_number)}`);
  const verify = await verifyRes.json().catch(() => ({}));
  if (!verifyRes.ok || !verify.status || !verify.paid) {
    throw new Error(verify.message || 'Payment could not be verified.');
  }

  orderPayload.paystack_reference = verify.reference || orderPayload.paystack_reference || reference;
  const items = JSON.parse(orderPayload.items || '[]');
  for (const item of items) {
    if (item.type === 'pre_order') continue;
    try {
      const product = await API.get('products', item.id);
      const newQty = Math.max(0, (product.stock_quantity || 0) - item.qty);
      await API.update('products', item.id, { stock_quantity: newQty });
    } catch (err) { console.warn('Stock update failed for', item.id, err); }
  }

  try {
    await API.create('orders', orderPayload);
  } catch (err) {
    await API.update('orders', orderPayload.id, orderPayload);
  }

  Cart.clear();
  sessionStorage.setItem('lastOrderNumber', orderPayload.order_number);
  sessionStorage.setItem('lastOrderEmail', orderPayload.customer_email);
  sessionStorage.removeItem('pendingPaystackOrderPayload');
  return true;
}

document.addEventListener('DOMContentLoaded', async () => {
  initLayout('');
  const params = new URLSearchParams(window.location.search);
  if (params.get('paystack_pending') === '1') {
    document.getElementById('successMsg').textContent = 'Verifying your payment...';
    document.getElementById('orderNumberBox').textContent = 'Please wait';
    try {
      await completePendingPaystackOrder(params.get('reference'));
      window.history.replaceState({}, '', 'order-success.html');
    } catch (err) {
      console.error(err);
      document.getElementById('orderNumberBox').textContent = 'Payment not verified';
      document.getElementById('successMsg').textContent = err.message || 'We could not verify your payment. Please contact support if you were debited.';
      return;
    }
  }

  const orderNumber = sessionStorage.getItem('lastOrderNumber');
  if (orderNumber) {
    document.getElementById('orderNumberBox').textContent = orderNumber;
  } else {
    document.getElementById('orderNumberBox').textContent = 'No recent order found';
    document.getElementById('successMsg').textContent = 'It looks like you navigated here directly. Check your email for order confirmation, or track your order below.';
  }
});
</script>
</body>
</html>
